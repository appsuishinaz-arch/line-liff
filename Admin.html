<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<base target="_top">
<style>
  :root{
    --bg:#F8F9FB;--surface:#fff;--surface-alt:#F3F4F6;--border:#E5E7EB;--border-strong:#D1D5DB;
    --text-1:#111827;--text-2:#4B5563;--text-3:#9CA3AF;
    --primary:#06C755;--primary-dark:#04A845;--primary-bg:#E6F9ED;
    --st-受付:#9CA3AF;--st-対応中:#3B82F6;--st-完了:#10B981;
    --radius:8px;--shadow:0 2px 8px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans JP','Hiragino Sans',sans-serif;background:var(--bg);color:var(--text-1);font-size:13px;line-height:1.6;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:-.02em;}
  .topbar{position:sticky;top:0;z-index:10;background:var(--primary);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);}
  .topbar h1{font-size:15px;margin:0;font-weight:700;}
  .topbar button{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}
  .wrap{max-width:1560px;margin:0 auto;padding:14px;}

  .filters{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .filter-line{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px 22px;align-items:center;}
  .frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .flabel{font-size:11px;color:var(--text-3);font-weight:700;min-width:42px;}
  .chipbtn{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:700;color:var(--text-2);cursor:pointer;}
  .chipbtn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .chipbtn .cnt{margin-left:6px;font-size:11px;opacity:.85;}
  select{border:1px solid var(--border-strong);border-radius:6px;padding:6px 10px;font-size:13px;font-family:inherit;background:#fff;}
  .combo{position:relative;display:inline-block;}
  .combo input{border:1px solid var(--border-strong);border-radius:6px;padding:6px 10px;font-size:13px;font-family:inherit;width:190px;background:#fff;}
  .combo input:focus{outline:none;border-color:var(--primary);}
  .cdrop{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:#fff;border:1px solid var(--border-strong);border-radius:6px;box-shadow:var(--shadow);max-height:240px;overflow-y:auto;z-index:30;display:none;}
  .cdrop div{padding:7px 11px;cursor:pointer;font-size:13px;}
  .cdrop div:hover{background:var(--primary-bg);}
  .cdrop div.sel-all{border-bottom:1px solid var(--border);color:var(--text-2);}

  .split{display:grid;grid-template-columns:380px minmax(0,480px) 360px;gap:14px;align-items:start;justify-content:center;}
  .pane-list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 200px);overflow-y:auto;padding-right:2px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;cursor:pointer;box-shadow:var(--shadow);}
  .card.sel{background:var(--primary-bg);border-color:var(--primary);box-shadow:0 0 0 2px var(--primary);}
  .card-top{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap;}
  .case-no{font-size:12px;font-weight:700;}
  .badge{display:inline-block;font-size:10px;font-weight:700;border-radius:999px;padding:2px 9px;color:#fff;}
  .b-受付{background:var(--st-受付);}.b-対応中{background:var(--st-対応中);}.b-完了{background:var(--st-完了);}
  .cat{font-size:10px;font-weight:700;color:var(--primary-dark);background:var(--primary-bg);border-radius:5px;padding:2px 7px;}
  .card-body{font-size:12px;color:var(--text-2);}.card-body .nm{color:var(--text-1);font-weight:600;}
  .meta-row{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--text-3);}
  .empty{text-align:center;color:var(--text-3);padding:40px 10px;}

  .pane-detail{position:sticky;top:78px;}
  .pane-memo{position:sticky;top:78px;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
  .panel h3{font-size:12px;color:var(--text-3);margin:0 0 10px;font-weight:700;}
  .detail-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .detail-no{font-size:17px;font-weight:700;}
  .kv{display:flex;gap:10px;margin:4px 0;font-size:13px;}
  .kv .k{color:var(--text-3);min-width:64px;flex:none;}
  .body-text{white-space:pre-wrap;background:var(--surface-alt);border-radius:6px;padding:10px 12px;font-size:13px;}
  .att{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin:4px 6px 0 0;font-size:12px;color:var(--primary-dark);text-decoration:none;}
  .status-btns{display:flex;gap:8px;margin-top:6px;}
  .sbtn{flex:1;border:1px solid var(--border-strong);background:#fff;border-radius:6px;padding:8px;font-size:12px;font-weight:700;color:var(--text-2);cursor:pointer;}
  .sbtn.cur.受付{background:var(--st-受付);color:#fff;border-color:transparent;}
  .sbtn.cur.対応中{background:var(--st-対応中);color:#fff;border-color:transparent;}
  .sbtn.cur.完了{background:var(--st-完了);color:#fff;border-color:transparent;}
  .acc-row{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .acc-label{font-size:12px;color:var(--text-3);font-weight:700;}
  .acc-btn{border:1px solid var(--border-strong);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;}
  .acc-btn.on{background:#FEF2F2;color:#b3261e;border-color:#f3c2c2;}
  .acc-btn.off{background:#F3F4F6;color:var(--text-2);border-color:var(--border-strong);}
  .acc-note{font-size:11px;color:var(--text-3);}
  .tag-block{font-size:10px;font-weight:700;color:#b3261e;background:#FEF2F2;border:1px solid #f3c2c2;border-radius:5px;padding:1px 6px;}
  .tag-ok{font-size:10px;font-weight:700;color:var(--primary-dark);background:var(--primary-bg);border:1px solid #b7e9cb;border-radius:5px;padding:1px 6px;}
  .memo{border-left:3px solid var(--primary);background:var(--surface-alt);border-radius:0 6px 6px 0;padding:8px 12px;margin-bottom:8px;}
  .memo .mtext{white-space:pre-wrap;font-size:13px;}
  .memo .mmeta{font-size:11px;color:var(--text-3);margin-top:4px;}
  .memo .mention{color:var(--primary-dark);font-weight:700;}
  .memo-form{position:relative;margin-top:10px;}
  textarea{width:100%;border:1px solid var(--border-strong);border-radius:6px;padding:10px;font-size:14px;font-family:inherit;resize:vertical;min-height:60px;}
  textarea:focus{outline:none;border-color:var(--primary);}
  .mention-hint{font-size:11px;color:var(--text-3);margin:4px 0;}
  .drop{position:absolute;left:0;right:0;background:#fff;border:1px solid var(--border-strong);border-radius:6px;box-shadow:var(--shadow);max-height:180px;overflow-y:auto;z-index:20;display:none;}
  .drop div{padding:8px 12px;cursor:pointer;font-size:13px;}
  .drop div:hover{background:var(--primary-bg);}
  .post{margin-top:8px;background:var(--primary);color:#fff;border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;}
  .chips{margin-top:6px;font-size:11px;color:var(--text-3);}
  .chip{display:inline-block;background:var(--primary-bg);color:var(--primary-dark);font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;margin:2px 4px 0 0;}
  .hist-item{font-size:12px;color:var(--text-2);padding:7px 0;border-bottom:1px dashed var(--border);}
  .hist-item .htype{font-weight:700;color:var(--primary-dark);background:var(--primary-bg);border-radius:5px;padding:1px 8px;margin-right:8px;}
  .hist-item .hdetail{color:var(--text-1);}
  .hist-item .hmeta{font-size:11px;color:var(--text-3);margin-top:3px;}
  .placeholder{color:var(--text-3);text-align:center;padding:60px 20px;}
  .back{display:none;background:none;border:none;color:var(--primary-dark);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0 8px;}
  .loading{text-align:center;color:var(--text-3);padding:20px 0;}

  @media(max-width:1180px){
    .split{grid-template-columns:360px minmax(0,1fr);}
    .pane-memo{position:static;grid-column:1 / -1;}
  }
  @media(max-width:760px){
    .split{grid-template-columns:1fr;}
    .pane-list{max-height:none;}
    .pane-detail,.pane-memo{position:static;display:none;}
    .pane-memo{grid-column:auto;}
    .split.show-detail .pane-list{display:none;}
    .split.show-detail .pane-detail,.split.show-detail .pane-memo{display:block;}
    .split.show-detail .back{display:block;}
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>入居者問合せ 管理</h1>
  <button onclick="reload()">更新</button>
</div>

<div class="wrap">
  <div class="filters">
    <div class="filter-line">
      <div class="frow"><span class="flabel">状態</span><span id="statusTabs"></span></div>
      <div class="frow"><span class="flabel">種類</span><span id="catBtns"></span></div>
      <div class="frow"><span class="flabel">エリア</span><span id="areaBtns"></span></div>
      <div class="frow"><span class="flabel">担当</span>
        <select id="staffRoleSel" onchange="onStaffRoleChange()" style="margin-right:4px">
          <option value="all">すべての役割</option>
          <option value="main">メイン担当</option>
          <option value="property">物件担当</option>
          <option value="sub">サブ担当（BM）</option>
          <option value="jimu">事務担当</option>
        </select>
        <div class="combo">
          <input id="staffInput" type="text" placeholder="全員（入力で絞り込み）" autocomplete="off" oninput="onStaffInput()" onfocus="onStaffInput()">
          <div class="cdrop" id="staffDrop"></div>
        </div>
      </div>
    </div>
    <div class="filter-line">
      <div class="frow"><span class="flabel">検索</span>
        <input id="searchInput" type="text" placeholder="物件名・入居者名・案件番号" autocomplete="off" oninput="onSearch()" style="width:280px;border:1px solid var(--border-strong);border-radius:6px;padding:6px 10px;font-size:13px;font-family:inherit;">
      </div>
      <div class="frow"><span class="flabel">並び</span><span id="sortBtns"></span></div>
    </div>
  </div>

  <div class="split" id="split">
    <div class="pane-list" id="list"><div class="loading">読み込み中…</div></div>
    <div class="pane-detail">
      <button class="back" onclick="closeDetail()">← 一覧に戻る</button>
      <div id="detail"><div class="placeholder">左の一覧から案件を選んでください。</div></div>
    </div>
    <div class="pane-memo">
      <div id="memo"></div>
    </div>
  </div>
</div>

<script>
  var INITIAL_CASE = '<?= initialCase ?>';
  var ALL_CASES = [];
  var STAFF = [], STATUSES = ['受付','対応中','完了'], CATEGORIES = ['設備不具合','家賃','その他'], AREAS = [];
  var CAT_LABEL = {'設備不具合':'設備','家賃':'家賃','その他':'その他'};
  var fStatus = '', fCategory = '', fArea = '', fStaff = '', fStaffRole = 'all', fSearch = '', sortOrder = 'desc';
  var curUid = null;        // 選択中の行ユニークID（案件番号が重複しても個別に選べる）
  var curCase = null;       // 選択中の案件番号（サーバ呼び出し用）
  var curDetail = null;     // 選択中の案件オブジェクト（ALL_CASES内の参照）
  var mentioned = {};

  window.addEventListener('load', boot);

  function boot(){ reload(true); }

  function reload(initial){
    document.getElementById('list').innerHTML = '<div class="loading">読み込み中…</div>';
    google.script.run.withSuccessHandler(function(b){
      ALL_CASES = b.cases||[]; STAFF = b.staff||[]; STATUSES = b.statuses||STATUSES; CATEGORIES = b.categories||CATEGORIES; AREAS = b.areas||[];
      ALL_CASES.forEach(function(c,i){ c._uid = i; });   // 行ごとに一意なID
      buildStaffSelect(); buildCatButtons(); buildAreaButtons(); buildSortButtons();
      applyFilters();
      if(initial && INITIAL_CASE){
        var first = ALL_CASES.filter(function(x){ return x.no===INITIAL_CASE; })[0];
        if(first) selectCase(first._uid);
      }
    }).withFailureHandler(fail).adminInit();
  }

  /* ---------- フィルタUI ---------- */
  function buildCatButtons(){
    var defs = [['','全部']].concat(CATEGORIES.map(function(c){ return [c, CAT_LABEL[c]||c]; }));
    document.getElementById('catBtns').innerHTML = defs.map(function(d){
      return '<button class="chipbtn '+(fCategory===d[0]?'active':'')+'" onclick="setCategory(\''+d[0]+'\')">'+esc(d[1])+'</button>';
    }).join(' ');
  }
  function buildStaffSelect(){
    // コンボボックスの表示を現在の選択に合わせる
    var inp = document.getElementById('staffInput'); if(!inp) return;
    if(!fStaff){ inp.value=''; }
    else { var s=STAFF.filter(function(x){ return x.id===fStaff; })[0]; inp.value = s ? s.name : ''; }
  }
  function onStaffInput(){
    var inp=document.getElementById('staffInput'); var drop=document.getElementById('staffDrop');
    var q=inp.value.trim().toLowerCase();
    var hits=STAFF.filter(function(s){ return s.name && s.name.toLowerCase().indexOf(q)>=0; });
    var html='<div class="sel-all" onmousedown="pickStaff(\'\')">全員</div>';
    html+=hits.map(function(s){ return '<div onmousedown="pickStaff(\''+esc(s.id)+'\')">'+esc(s.name)+(s.email?'<span style="color:var(--text-3);font-size:11px"> '+esc(s.email)+'</span>':'')+'</div>'; }).join('');
    drop.innerHTML=html; drop.style.display='block';
  }
  function pickStaff(id){
    fStaff=id;
    var inp=document.getElementById('staffInput');
    if(!id){ inp.value=''; }
    else { var s=STAFF.filter(function(x){ return x.id===id; })[0]; inp.value = s ? s.name : ''; }
    document.getElementById('staffDrop').style.display='none';
    applyFilters();
  }
  // 外側クリックでコンボのドロップを閉じる（フィルタ・担当変更どちらも）
  document.addEventListener('click', function(e){
    var combos=document.querySelectorAll('.combo');
    for(var i=0;i<combos.length;i++){
      if(!combos[i].contains(e.target)){
        var d=combos[i].querySelector('.cdrop'); if(d) d.style.display='none';
      }
    }
  });
  function buildAreaButtons(){
    var defs = [['','全部']].concat(AREAS.map(function(a){ return [a,a]; }));
    document.getElementById('areaBtns').innerHTML = defs.map(function(d){
      return '<button class="chipbtn '+(fArea===d[0]?'active':'')+'" onclick="setArea(\''+d[0]+'\')">'+esc(d[1])+'</button>';
    }).join(' ');
  }
  function buildSortButtons(){
    var defs = [['desc','新しい順'],['asc','古い順']];
    document.getElementById('sortBtns').innerHTML = defs.map(function(d){
      return '<button class="chipbtn '+(sortOrder===d[0]?'active':'')+'" onclick="setSort(\''+d[0]+'\')">'+d[1]+'</button>';
    }).join(' ');
  }
  function setSort(v){ sortOrder=v; buildSortButtons(); applyFilters(); }
  function onStaffRoleChange(){ fStaffRole=document.getElementById('staffRoleSel').value; applyFilters(); }
  function onSearch(){ fSearch=document.getElementById('searchInput').value; applyFilters(); }
  function setCategory(v){ fCategory=v; buildCatButtons(); applyFilters(); }
  function setArea(v){ fArea=v; buildAreaButtons(); applyFilters(); }
  function setStatus(v){ fStatus=v; applyFilters(); }

  /* ---------- 絞り込み（全部クライアント側＝一瞬） ---------- */
  function staffMatches(c){
    if(!fStaff) return true;
    if(fStaffRole==='main')     return c.staffId===fStaff;
    if(fStaffRole==='property') return c.propStaffId===fStaff;
    if(fStaffRole==='sub')      return c.subStaffId===fStaff;
    if(fStaffRole==='jimu')     return c.jimuStaffId===fStaff;
    // すべての役割のいずれかに一致
    return c.staffId===fStaff || c.propStaffId===fStaff || c.subStaffId===fStaff || c.jimuStaffId===fStaff;
  }
  function applyFilters(){
    var q = (fSearch||'').trim().toLowerCase();
    // カテゴリ＋エリア＋担当＋検索で絞った母集団
    var base = ALL_CASES.filter(function(c){
      if(fCategory && c.category!==fCategory) return false;
      if(fArea && c.area!==fArea) return false;
      if(!staffMatches(c)) return false;
      if(q){
        var hay = ((c.building||'')+' '+(c.name||'')+' '+(c.no||'')+' '+(c.room||'')).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    // 状態タブの件数は母集団から算出
    var counts = { '全て':base.length, '受付':0,'対応中':0,'完了':0 };
    base.forEach(function(c){ if(counts[c.status]!==undefined) counts[c.status]++; });
    renderStatusTabs(counts);
    // 状態でさらに絞ってリスト表示
    var rows = fStatus ? base.filter(function(c){ return c.status===fStatus; }) : base;
    rows = rows.slice().sort(function(a,b){
      var d = (a.rcvT||0) - (b.rcvT||0);
      return sortOrder==='asc' ? d : -d;
    });
    renderList(rows);
  }

  function renderStatusTabs(counts){
    var defs = [['','全て'],['受付','受付'],['対応中','対応中'],['完了','完了']];
    document.getElementById('statusTabs').innerHTML = defs.map(function(d){
      var key = d[0]===''?'全て':d[0];
      return '<button class="chipbtn '+(fStatus===d[0]?'active':'')+'" onclick="setStatus(\''+d[0]+'\')">'+d[1]+'<span class="cnt">'+(counts[key]||0)+'</span></button>';
    }).join(' ');
  }

  function renderList(rows){
    rows = rows||[];
    var box = document.getElementById('list');
    if(!rows.length){ box.innerHTML = '<div class="empty">該当する案件はありません。</div>'; return; }
    box.innerHTML = rows.map(function(r){
      return '<div class="card '+(curUid===r._uid?'sel':'')+'" onclick="selectCase('+r._uid+')">'
        + '<div class="card-top"><span class="case-no mono">'+esc(r.no)+'</span>'
        + '<span class="badge b-'+esc(r.status)+'">'+esc(r.status)+'</span>'
        + '<span class="cat">'+esc(CAT_LABEL[r.category]||r.category)+'</span>'
        + (r.open?'<span class="tag-block">トーク解放中</span>':'')+'</div>'
        + '<div class="card-body"><span class="nm">'+esc(r.name)+'</span> ／ '+esc(r.building)+' '+esc(r.room)+'</div>'
        + '<div class="meta-row"><span>担当: '+esc(r.staffName||'—')+'</span><span class="mono">'+esc(r.receivedAt)+'</span></div>'
        + '</div>';
    }).join('');
  }

  /* ---------- 詳細（一覧データから即表示→メモ/履歴だけ裏で取得） ---------- */
  function selectCase(uid){
    var c = ALL_CASES.filter(function(x){ return x._uid===uid; })[0];
    if(!c) return;
    curUid = uid; curCase = c.no; curDetail = c; mentioned = {};
    document.getElementById('split').classList.add('show-detail');
    applyFilters();          // 選択ハイライト反映
    renderDetail(c, true);   // 即描画（メモ/履歴は読み込み中）
    google.script.run.withSuccessHandler(function(ex){
      c.memos = ex.memos||[]; c.history = ex.history||[];
      if(curUid===uid) renderDetail(c, false);
    }).withFailureHandler(function(){ /* extrasだけ失敗は無視 */ }).adminGetExtras(c.no);
  }

  function closeDetail(){
    curUid=null; curCase=null; curDetail=null;
    document.getElementById('split').classList.remove('show-detail');
    document.getElementById('detail').innerHTML='<div class="placeholder">左の一覧から案件を選んでください。</div>';
    document.getElementById('memo').innerHTML='';
    applyFilters();
  }

  function renderDetail(d, loadingExtras){
    var atts = (d.attachments||[]).map(function(u,i){ return '<a class="att" href="'+u+'" target="_blank">📎 添付'+(i+1)+'</a>'; }).join('') || '<span style="color:var(--text-3)">なし</span>';
    var sbtns = STATUSES.map(function(s){
      return '<button class="sbtn '+(d.status===s?'cur '+s:'')+'" onclick="changeStatus(\''+d.no+'\',\''+s+'\')">'+s+'</button>';
    }).join('');

    var memosHtml;
    if(loadingExtras && d.memos===undefined){ memosHtml='<div class="loading">読み込み中…</div>'; }
    else {
      var memos = d.memos||[];
      memosHtml = memos.length ? memos.map(function(m){
        var text = esc(m.text);
        (m.mentions ? m.mentions.split(',') : []).forEach(function(nm){
          nm = nm.trim(); if(!nm) return;
          var tag = '@'+esc(nm);
          text = text.split(tag).join('<span class="mention">'+tag+'</span>');
        });
        return '<div class="memo"><div class="mtext">'+text+'</div><div class="mmeta mono">'+esc(m.at)+'</div></div>';
      }).join('') : '<div style="color:var(--text-3);font-size:12px">まだ社内メモはありません。</div>';
    }

    var histHtml;
    if(loadingExtras && d.history===undefined){ histHtml='<div class="loading">読み込み中…</div>'; }
    else {
      var hist = d.history||[];
      histHtml = hist.length ? hist.map(function(h){
        return '<div class="hist-item"><span class="htype">'+esc(h.type)+'</span>'
          + (h.detail?'<span class="hdetail">'+esc(h.detail)+'</span>':'')
          + '<div class="hmeta mono">'+esc(h.at)+'</div></div>';
      }).join('') : '<div style="color:var(--text-3);font-size:12px">履歴はありません。</div>';
    }

    document.getElementById('detail').innerHTML =
      '<div class="panel">'
      + '<div class="detail-head"><span class="detail-no mono">'+esc(d.no)+'</span>'
      + '<span class="badge b-'+esc(d.status)+'">'+esc(d.status)+'</span>'
      + '<span class="cat">'+esc(CAT_LABEL[d.category]||d.category)+'</span></div>'
      + '<div class="status-btns">'+sbtns+'</div>'
      + '<div class="acc-row"><span class="acc-label">入居者トーク</span>'
      + '<button class="acc-btn '+(d.open?'on':'off')+'" onclick="toggleTalk()">'+(d.open?'トーク解放中':'トーク非解放')+'</button>'
      + '<span class="acc-note">'+(d.open?'担当者がLINEトークで直接やり取り中（Botは応答しません）。対応が終わったら非解放に戻してください。':'通常運用。入居者のメッセージには「担当者からの連絡をお待ちください」と自動返信します。')+'</span>'
      + '</div></div>'

      + '<div class="panel"><h3>入居者情報</h3>'
      + kv('お名前', d.name) + kv('LINE表示名', d.lineName||'—') + kv('エリア', d.area||'—') + kv('建物', d.building+' '+d.room)
      + kv('電話', d.tel||'—') + kv('メール', d.email||'—')
      + kv('受付', d.receivedAt) + '</div>'

      + '<div class="panel"><h3>問い合わせ内容</h3><div class="body-text">'+esc(d.body)+'</div>'
      + '<h3 style="margin-top:14px">添付</h3>'+atts+'</div>'

      + '<div class="panel"><h3>担当情報</h3>'
      + '<div class="kv"><span class="k">メイン担当<br><span style="font-weight:400;color:#999;font-size:10px">（対応者）</span></span><span class="v"><span class="combo">'
      + '<input id="caseStaffInput" type="text" placeholder="未割り当て" autocomplete="off" value="'+esc(d.staffName||'')+'" oninput="onCaseStaffInput()" onfocus="onCaseStaffInput()">'
      + '<div class="cdrop" id="caseStaffDrop"></div></span></span></div>'
      + kv('物件担当', d.propStaffName||'—')
      + kv('サブ担当（BM）', d.subStaffName||'—')
      + kv('事務担当', d.jimuStaffName||'—')
      + '<div style="font-size:11px;color:var(--text-3);margin-top:8px">※ メイン担当はこの案件の対応者（手動でアサイン）。物件担当・サブ・事務は建物マスタの設定です。受付メールは物件担当・サブ・事務に送られます。</div>'
      + '</div>'

      + '<div class="panel"><h3>履歴</h3>'+histHtml+'</div>';

    document.getElementById('memo').innerHTML =
      '<div class="panel"><h3>社内メモ</h3>'+memosHtml
      + '<div class="memo-form">'
      + '<textarea id="memoText" placeholder="社内メモを入力（@で担当者をメンション）" oninput="onMemoInput()"></textarea>'
      + '<div class="drop" id="drop"></div>'
      + '<div class="mention-hint">「@」で担当者を選べます。メンションした人にメール通知されます。</div>'
      + '<div class="chips" id="chips"></div>'
      + '<button class="post" onclick="postMemo()">メモを投稿</button>'
      + '</div></div>';

    renderChips();
  }

  /* ---------- 担当変更（楽観的更新） ---------- */
  function onCaseStaffInput(){
    var inp=document.getElementById('caseStaffInput'); var drop=document.getElementById('caseStaffDrop');
    if(!inp||!drop) return;
    var q=inp.value.trim().toLowerCase();
    var hits=STAFF.filter(function(s){ return s.name && s.name.toLowerCase().indexOf(q)>=0; });
    var html='<div class="sel-all" onmousedown="pickCaseStaff(\'\')">未割り当て</div>';
    html+=hits.map(function(s){ return '<div onmousedown="pickCaseStaff(\''+esc(s.id)+'\')">'+esc(s.name)+(s.email?'<span style="color:var(--text-3);font-size:11px"> '+esc(s.email)+'</span>':'')+'</div>'; }).join('');
    drop.innerHTML=html; drop.style.display='block';
  }
  function pickCaseStaff(id){
    if(!curDetail) return;
    var s=STAFF.filter(function(x){ return x.id===id; })[0];
    var prevId=curDetail.staffId, prevName=curDetail.staffName;
    curDetail.staffId=id; curDetail.staffName= s ? s.name : '';
    document.getElementById('caseStaffDrop').style.display='none';
    renderDetail(curDetail,false); applyFilters();
    google.script.run.withSuccessHandler(function(){})
      .withFailureHandler(function(e){
        curDetail.staffId=prevId; curDetail.staffName=prevName; renderDetail(curDetail,false); applyFilters(); fail(e);
      }).adminSetStaff(curDetail.no, id);
  }

  function kv(k,v){ return '<div class="kv"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>'; }

  /* ---------- ステータス変更（楽観的更新） ---------- */
  function changeStatus(no, status){
    if(!curDetail || curDetail.status===status) return;
    var prev = curDetail.status;
    curDetail.status = status;     // ALL_CASES内の参照も同時に更新される
    renderDetail(curDetail, false);
    applyFilters();
    google.script.run.withSuccessHandler(function(){})
      .withFailureHandler(function(e){ curDetail.status=prev; renderDetail(curDetail,false); applyFilters(); fail(e); })
      .adminUpdateStatus(no, status);
  }

  /* ---------- トーク解放ON/OFF（楽観的更新・同一ユーザーの全案件に反映） ---------- */
  function toggleTalk(){
    if(!curDetail || !curDetail.userId){ alert('この案件の入居者IDが取得できません'); return; }
    var uid = curDetail.userId; var next = !curDetail.open;
    ALL_CASES.forEach(function(c){ if(c.userId===uid) c.open=next; });
    curDetail.open = next;
    renderDetail(curDetail,false); applyFilters();
    google.script.run.withSuccessHandler(function(){})
      .withFailureHandler(function(e){
        ALL_CASES.forEach(function(c){ if(c.userId===uid) c.open=!next; });
        curDetail.open=!next; renderDetail(curDetail,false); applyFilters(); fail(e);
      }).adminSetTalkOpen(uid, next);
  }

  /* ---------- 社内メモ＋@メンション（楽観的更新） ---------- */
  function onMemoInput(){
    var ta=document.getElementById('memoText'); var caret=ta.selectionStart;
    var m=ta.value.slice(0,caret).match(/@([^@\s]*)$/);
    var drop=document.getElementById('drop');
    if(!m){ drop.style.display='none'; return; }
    var q=m[1].toLowerCase();
    var hits=STAFF.filter(function(s){ return s.name && s.name.toLowerCase().indexOf(q)>=0; });
    if(!hits.length){ drop.style.display='none'; return; }
    drop.innerHTML=hits.map(function(s){ return '<div onclick="pickMention(\''+s.id+'\')">'+esc(s.name)+'<span style="color:var(--text-3);font-size:11px"> '+esc(s.email||'')+'</span></div>'; }).join('');
    drop.style.display='block';
  }
  function pickMention(id){
    var s=STAFF.filter(function(x){ return x.id===id; })[0]; if(!s) return;
    mentioned[id]=s.name;
    var ta=document.getElementById('memoText'); var caret=ta.selectionStart;
    ta.value=ta.value.slice(0,caret).replace(/@([^@\s]*)$/,'@'+s.name+' ')+ta.value.slice(caret);
    document.getElementById('drop').style.display='none'; ta.focus(); renderChips();
  }
  function renderChips(){
    var ids=Object.keys(mentioned);
    var el=document.getElementById('chips'); if(!el) return;
    el.innerHTML = ids.length ? '通知先: '+ids.map(function(id){ return '<span class="chip">@'+esc(mentioned[id])+'</span>'; }).join('') : '';
  }
  function postMemo(){
    var ta=document.getElementById('memoText'); var text=ta.value.trim(); if(!text) return;
    var ids=Object.keys(mentioned).filter(function(id){ return text.indexOf('@'+mentioned[id])>=0; });
    var mnames=ids.map(function(id){ return mentioned[id]; }).join(',');
    if(!curDetail.memos) curDetail.memos=[];
    curDetail.memos=curDetail.memos.concat([{text:text,mentions:mnames,at:'送信中…'}]);
    mentioned={};
    renderDetail(curDetail,false);
    google.script.run.withSuccessHandler(function(memos){
      curDetail.memos=memos||curDetail.memos; renderDetail(curDetail,false);
    }).withFailureHandler(function(e){ curDetail.memos.pop(); renderDetail(curDetail,false); fail(e); })
    .adminAddMemo(curCase, text, ids);
  }

  function fail(e){ alert('エラー: '+(e&&e.message?e.message:e)); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
</script>
</body>
</html>
