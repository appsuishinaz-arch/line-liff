<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>お問い合わせ</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{--line:#06C755;--line-dark:#05a648;--ink:#1f2328;--sub:#6b7280;--gray:#e5e7eb;--bg:#f6f7f9;--req:#e8453c;}
  *{box-sizing:border-box;}
  body{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;}
  .head{text-align:center;padding:8px 0 16px;}
  .head h1{font-size:18px;margin:0 0 4px;}.head p{font-size:13px;color:var(--sub);margin:0;}
  .cat-badge{display:inline-block;background:#e7f8ee;color:var(--line-dark);font-weight:700;font-size:13px;border-radius:6px;padding:3px 12px;margin-top:6px;}
  .card{background:#fff;border:1px solid var(--gray);border-radius:12px;padding:16px;margin-bottom:14px;}
  .sec-title{font-size:14px;font-weight:700;margin:0 0 12px;}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;}label:first-of-type{margin-top:0;}
  .req{color:#fff;background:var(--req);font-size:10px;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px;}
  .opt{color:var(--sub);font-size:11px;margin-left:6px;}
  textarea,select{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--gray);border-radius:8px;background:#fff;font-family:inherit;}
  textarea{min-height:120px;resize:vertical;}
  textarea:focus,select:focus{outline:none;border-color:var(--line);}
  .btn{border:none;border-radius:8px;font-size:15px;font-weight:700;padding:12px 16px;cursor:pointer;font-family:inherit;}
  .btn-sub{background:#eef0f2;color:var(--ink);width:100%;}
  .btn-line{background:var(--line);color:#fff;width:100%;font-size:16px;padding:14px;margin-top:8px;}.btn-line:active{background:var(--line-dark);}
  .btn:disabled{opacity:.5;}
  .att-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
  .chip{display:flex;align-items:center;gap:10px;border:1px solid var(--gray);border-radius:8px;padding:8px 10px;background:#fafafa;}
  .chip .thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#eee;flex:none;}
  .chip .meta{flex:1;min-width:0;}
  .chip .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip .sz{font-size:11px;color:var(--sub);}
  .chip .rm{flex:none;width:28px;height:28px;border-radius:50%;border:none;background:#f0f0f0;color:#888;font-size:16px;cursor:pointer;}
  .chip .rm:active{background:#e0e0e0;}
  .file-hint{font-size:12px;color:var(--sub);margin-top:6px;}
  .msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-top:10px;display:none;}.msg.err{background:#fdecea;color:#b3261e;display:block;}
  .done{text-align:center;padding:48px 16px;display:none;}.done .check{font-size:48px;}.done h2{font-size:18px;margin:12px 0 6px;}
  .done p{color:var(--sub);font-size:14px;}
  .loading{text-align:center;padding:60px 16px;color:var(--sub);}.hidden{display:none;}
</style>
</head>
<body>

<div id="loading" class="loading">読み込み中…</div>

<div id="gate" class="wrap hidden" style="text-align:center;padding:40px 20px;">
  <h1 style="font-size:18px;margin-bottom:12px;">基本情報の登録が必要です</h1>
  <p style="color:#555;line-height:1.7;margin-bottom:24px;">お問い合わせの前に、お住まいの建物・お部屋・ご連絡先のご登録をお願いします。<br>下のボタンから登録してください。</p>
  <a id="gateRegBtn" href="#" style="display:inline-block;background:#06c755;color:#fff;font-weight:700;text-decoration:none;padding:14px 28px;border-radius:10px;">基本情報を登録する</a>
</div>

<div id="app" class="wrap hidden">
  <div class="head">
    <h1>ご入居者様 お問い合わせ</h1>
    <p>下記をご入力のうえ送信してください。</p>
    <div class="cat-badge" id="catBadge"></div>
  </div>

  <div class="card hidden" id="catPickCard">
    <div class="sec-title">お問い合わせの種類<span class="req">必須</span></div>
    <select id="catSelect">
      <option value="">選択してください</option>
      <option value="設備不具合">設備不具合</option>
      <option value="家賃">家賃などの支払いについて</option>
      <option value="その他">その他のお問い合わせ</option>
    </select>
  </div>

  <div class="card">
    <div class="sec-title">お問い合わせ内容</div>
    <label>内容<span class="req">必須</span></label>
    <textarea id="body" placeholder="ご質問・ご相談の内容を具体的にご入力ください。"></textarea>

    <label style="margin-top:14px">写真・ファイル添付<span class="opt">任意・最大3つ・写真は自動で軽くします</span></label>
    <div class="att-list" id="attList"></div>
    <button type="button" class="btn btn-sub" id="addFileBtn">＋ 写真・ファイルを追加</button>
    <input type="file" id="fileInput" accept="image/*,.pdf" style="display:none">
    <div class="file-hint">写真は不具合箇所が分かるものだと対応がスムーズです。</div>
  </div>

  <div id="msg" class="msg"></div>
  <button class="btn btn-line" id="submitBtn">送信する</button>
</div>

<div id="done" class="done">
  <div class="check">✅</div>
  <h2>お問い合わせを受け付けました</h2>
  <p>受付番号はLINEのトークにお送りします。<br>担当者より追ってご連絡いたします。</p>
</div>

<script>
  // ===== 設定（ここだけ書き換える）=====
  var LIFF_ID = '2010296392-ndiczLvq';
  var REGISTER_LIFF = 'https://liff.line.me/2010296392-M3917y47';   // 基本情報の登録フォーム
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbybgmPqNA_YSfQCjlF7T51FyJHNuK9sx4ueiLeyNfCQ9wC6xbdaA9-2gFXlj84IRhANPQ/exec';
  // =====================================

  var CATEGORY = (new URLSearchParams(location.search).get('category')) || '';
  var profile = { userId:'', displayName:'' };

  var MAX_FILES = 3;
  var IMG_MAX_DIM = 1600;     // 画像の長辺上限（px）
  var IMG_QUALITY = 0.8;      // JPEG品質
  var PDF_MAX = 5 * 1024 * 1024; // PDFはこのサイズまで（圧縮できないため）
  var attachments = [];       // { name, mimeType, data(base64), bytes, preview }

  window.addEventListener('load', boot);

  function boot(){
    liff.init({ liffId: LIFF_ID })
      .then(function(){
        if(!liff.isLoggedIn()){ doLogin(); return; }
        return liff.getProfile().then(function(p){
          profile.userId = p.userId; profile.displayName = p.displayName||'';
          checkRegistered(p.userId);
        }).catch(function(){ doLogin(); });
      })
      .catch(function(e){
        var m = String((e && e.message) || e);
        if(m.indexOf('expired')>=0 || m.indexOf('token')>=0){ doLogin(); return; }
        document.getElementById('loading').textContent = 'LIFF初期化エラー: ' + e;
      });
  }

  // 自動ログインは最大1回だけ（?_r=1 で判定）。それ以上はループさせず手動ボタンに
  function doLogin(){
    if(location.search.indexOf('_r=1') >= 0){ showRelogin(); return; }
    var sep = location.href.indexOf('?') >= 0 ? '&' : '?';
    liff.login({ redirectUri: location.href + sep + '_r=1' });
  }
  function showRelogin(){
    var el = document.getElementById('loading');
    el.innerHTML =
      'ログインの有効期限が切れているか、うまくログインできませんでした。<br><br>'
      + '<button id="reBtn" style="background:#06c755;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:700;font-size:15px;">ログインし直す</button>'
      + '<br><br><span style="color:#888;font-size:13px;">解決しない場合は、LINEのトーク画面に戻り、メニューからもう一度開いてください。</span>';
    document.getElementById('reBtn').addEventListener('click', function(){
      liff.login({ redirectUri: location.href.split('?')[0] });
    });
  }

  // 基本情報が登録済みか確認（未登録なら問い合わせフォームを出さずゲート表示）
  function checkRegistered(uid){
    var url = GAS_URL + (GAS_URL.indexOf('?')>=0?'&':'?') + 'action=isRegistered&uid=' + encodeURIComponent(uid);
    fetch(url).then(function(r){ return r.json(); })
      .then(function(res){ if(res && res.registered){ ready(); } else { showGate(); } })
      .catch(function(){ ready(); }); // 確認に失敗したらフォームは出す（送信時にサーバ側で再チェックされる）
  }

  function showGate(){
    document.getElementById('loading').classList.add('hidden');
    var btn = document.getElementById('gateRegBtn');
    btn.setAttribute('href', REGISTER_LIFF);
    document.getElementById('gate').classList.remove('hidden');
  }

  function ready(){
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    if(CATEGORY){ document.getElementById('catBadge').textContent = catLabel(CATEGORY); }
    else { document.getElementById('catBadge').classList.add('hidden'); document.getElementById('catPickCard').classList.remove('hidden'); }
    document.getElementById('addFileBtn').addEventListener('click', function(){ document.getElementById('fileInput').click(); });
    document.getElementById('fileInput').addEventListener('change', onFilePicked);
    document.getElementById('submitBtn').addEventListener('click', submit);
  }

  function catLabel(c){ return {'設備不具合':'設備の不具合','家賃':'家賃などの支払いについて','その他':'その他のお問い合わせ'}[c]||c; }
  function getCategory(){ return CATEGORY || document.getElementById('catSelect').value; }

  // ===== 添付：追加 =====
  function onFilePicked(e){
    clearError();
    var file = e.target.files[0];
    e.target.value = ''; // 同じファイルを再選択できるようにリセット
    if(!file) return;
    if(attachments.length >= MAX_FILES){ showError('添付は最大' + MAX_FILES + 'つまでです'); return; }

    var isImage = /^image\//.test(file.type) || /\.(jpe?g|png|gif|heic|heif|webp)$/i.test(file.name);
    var isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);

    if(isImage){
      compressImage(file).then(function(item){
        attachments.push(item); renderChips();
      }).catch(function(){ showError('画像の処理に失敗しました'); });
    } else if(isPdf){
      if(file.size > PDF_MAX){ showError('PDFは5MBまでです（' + fmtSize(file.size) + '）'); return; }
      toBase64(file).then(function(b64){
        attachments.push({ name:file.name, mimeType:'application/pdf', data:b64, bytes:file.size, preview:null });
        renderChips();
      }).catch(function(){ showError('ファイルの読み込みに失敗しました'); });
    } else {
      showError('画像かPDFを選んでください');
    }
  }

  // 画像を縮小＋JPEG化（HEIC含めcanvas経由でJPEGに正規化）
  function compressImage(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, IMG_MAX_DIM / Math.max(w, h));
        w = Math.round(w*scale); h = Math.round(h*scale);
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        var dataUrl = c.toDataURL('image/jpeg', IMG_QUALITY);
        var b64 = dataUrl.split(',')[1];
        resolve({
          name: file.name.replace(/\.[^.]+$/, '') + '.jpg',
          mimeType: 'image/jpeg',
          data: b64,
          bytes: Math.round(b64.length * 3 / 4),
          preview: dataUrl
        });
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('decode failed')); };
      img.src = url;
    });
  }

  // ===== 添付：表示・削除 =====
  function renderChips(){
    var box = document.getElementById('attList');
    box.innerHTML = '';
    attachments.forEach(function(a, i){
      var row = document.createElement('div');
      row.className = 'chip';
      var thumb = a.preview
        ? '<img class="thumb" src="' + a.preview + '">'
        : '<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:11px;color:#999">PDF</div>';
      row.innerHTML = thumb
        + '<div class="meta"><div class="nm">' + esc(a.name) + '</div><div class="sz">' + fmtSize(a.bytes) + '</div></div>'
        + '<button type="button" class="rm" data-i="' + i + '">✕</button>';
      box.appendChild(row);
    });
    Array.prototype.forEach.call(box.querySelectorAll('.rm'), function(btn){
      btn.addEventListener('click', function(){ attachments.splice(parseInt(btn.getAttribute('data-i'),10),1); renderChips(); });
    });
    document.getElementById('addFileBtn').style.display = (attachments.length >= MAX_FILES) ? 'none' : 'block';
  }

  // ===== 送信 =====
  function submit(){
    clearError();
    var category = getCategory();
    var bodyText = document.getElementById('body').value.trim();
    if(!category) return showError('お問い合わせの種類を選択してください');
    if(!bodyText) return showError('お問い合わせ内容を入力してください');

    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '送信中…';

    var accessToken = liff.getAccessToken();
    var payloadAtt = attachments.map(function(a){ return { name:a.name, mimeType:a.mimeType, data:a.data }; });

    postToGas({
      formType: 'inquiry',
      accessToken: accessToken,
      category: category,
      body: bodyText,
      attachments: payloadAtt
    }).then(function(){
      document.getElementById('app').classList.add('hidden');
      document.getElementById('done').style.display='block';
      if(liff.isInClient && liff.isInClient()){ setTimeout(function(){ liff.closeWindow(); }, 2500); }
    }).catch(function(e){
      btn.disabled=false; btn.textContent='送信する';
      showError('送信エラー: '+e);
    });
  }

  function toBase64(file){
    return new Promise(function(res,rej){
      var r = new FileReader();
      r.onload = function(){ res(String(r.result).split(',')[1]); };
      r.onerror = function(){ rej(new Error('read failed')); };
      r.readAsDataURL(file);
    });
  }
  function postToGas(payload){
    return fetch(GAS_URL, { method:'POST', mode:'no-cors', body: JSON.stringify(payload) });
  }
  function fmtSize(b){ return b < 1024*1024 ? Math.max(1,Math.round(b/1024)) + ' KB' : (b/1024/1024).toFixed(1) + ' MB'; }
  function showError(t){ var m=document.getElementById('msg'); m.textContent=t; m.className='msg err'; }
  function clearError(){ var m=document.getElementById('msg'); m.textContent=''; m.className='msg'; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
</script>
</body>
</html>
